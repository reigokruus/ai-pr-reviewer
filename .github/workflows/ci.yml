name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

  review:
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}

    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Skip when no API key is available
        if: env.LLM_API_KEY == ''
        run: echo "No LLM_API_KEY available (for example in a pull request from a fork). Skipping the AI review." >> "$GITHUB_STEP_SUMMARY"

      - name: Run AI review
        if: env.LLM_API_KEY != ''
        env:
          DIFF_BASE: origin/${{ github.base_ref }}
          DIFF_HEAD: HEAD
        run: npm run review

      - name: Post review comment
        if: env.LLM_API_KEY != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file review.md --edit-last --create-if-none